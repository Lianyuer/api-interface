# 应用服务 WEB 访问端口
server:
  port: 8201
  servlet:
    context-path: /api

spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/api_open_platform
    username: root
    password: 123456

  # Redis 配置
  redis:
    database: 1
    host: localhost
    port: 6379
    timeout: 5000
    password: 123456

# MyBatis配置
mybatis:
  configuration:
    map-underscore-to-camel-case: false  # 改为false，因为数据库字段是驼峰

# MyBatis-Plus配置（重要！）
mybatis-plus:
  configuration:
    # 关闭下划线转驼峰
    map-underscore-to-camel-case: false

yuapi:
  client:
    access-key: testAccessKey
    secret-key: testSecretKey